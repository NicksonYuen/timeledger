<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Ledger</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Time Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF1EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --sunk:#E3E8E3; --ink:#18211E; --muted:#5E6B66; --line:#D2DAD4; --brass:#9A6A14; --brass-soft:#F3E6C8;
  --bad:#B4412F; --good:#2A7F57;
  --c-family:#D9486F; --c-health:#2E9D6A; --c-social:#D98C1E; --c-sleep:#5566C2;
  --c-cpa:#2F5D7C; --c-clinic:#138EA0; --c-ai:#7C9A2D; --c-hobbies:#9150B0; --c-chores:#868C83; --c-waste:#A13A3A; --c-meal:#B38B59;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111714; --surface:#1A221E; --sunk:#232D28; --ink:#E6ECE8; --muted:#94A39C; --line:#2E3A34; --brass:#DDAA4A; --brass-soft:#3A2F17;
    --bad:#EE7A66; --good:#5CC792; --c-cpa:#5B90B3; --c-chores:#9DA39A; --c-sleep:#7A89DD; --c-waste:#D86A5E; --c-ai:#9DBB4A; --c-meal:#CFA878;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#1A221E; --sunk:#232D28; --ink:#E6ECE8; --muted:#94A39C; --line:#2E3A34; --brass:#DDAA4A; --brass-soft:#3A2F17;
  --bad:#EE7A66; --good:#5CC792; --c-cpa:#5B90B3; --c-chores:#9DA39A; --c-sleep:#7A89DD; --c-waste:#D86A5E; --c-ai:#9DBB4A; --c-meal:#CFA878;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.45 Figtree,"PingFang HK","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input{font:inherit;color:inherit}
.num{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding:12px 16px 110px}
h1,h2,h3{margin:0;font-weight:700}
h2{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-size:1.15rem;margin:22px 0 10px}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* day header */
.dayhead{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
.dayhead .mid{flex:1;text-align:center}
.dayhead .date{font-family:"Bricolage Grotesque",sans-serif;font-size:1.45rem;font-weight:700;line-height:1.1}
.navbtn{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:1.3rem;display:grid;place-items:center}
.navbtn:disabled{opacity:.3}

.seg{display:flex;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:600;font-size:.95rem;line-height:1.2}
.seg button small{display:block;font-weight:500;font-size:.75rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* the bank */
.bank{margin:16px 0 6px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.bank-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.bank-left{font-size:2.6rem;font-weight:700;line-height:1}
.bank-left.done{color:var(--good)}
.upto{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.upto-t{font-size:1.7rem;font-weight:700;line-height:1}
.cellfoot{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-top:5px}
.cells{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:14px}
.cell{aspect-ratio:1/1.15;border-radius:5px;border:1.5px dashed var(--line)}
.cell.on{border:0;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.cell.on{animation:none}.shake{animation:none!important}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--sunk);font-weight:700;font-size:1.1rem}
.stepper .val{min-width:64px;white-space:nowrap;text-align:center;font-weight:700}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;text-align:left;min-height:92px;padding:12px 12px 10px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);
  overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background .15s}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.tile.has{background:color-mix(in srgb,var(--c) 13%,var(--surface));border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.tile .nm{font-weight:700;font-size:1.02rem}
.tile .zh{color:var(--muted);font-weight:500;margin-left:4px}
.tile .hint{font-size:.76rem;color:var(--muted);line-height:1.25;margin-top:2px;padding-right:18px}
.tile .ct{position:absolute;right:12px;bottom:8px;font-size:1.35rem;font-weight:700;color:var(--c)}
.tile.wide{grid-column:1/-1;min-height:76px}
.tile .minus{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-weight:700;display:grid;place-items:center}
.combos{display:flex;flex-direction:column;gap:8px}
.combo{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;user-select:none;-webkit-user-select:none}
.combo.has{border-color:var(--brass)}
.combo .sw{width:22px;height:22px;border-radius:6px;flex:none}
.combo .cn{flex:1;font-weight:600}
.combo .cc{font-size:.78rem;color:var(--muted);display:block;font-weight:500}
.combo .ct{font-weight:700}
.combo .minus{width:30px;height:30px;border-radius:50%;background:var(--sunk);font-weight:700}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{padding:11px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{color:var(--bad)}
.note{padding:10px 12px;border-radius:12px;background:var(--brass-soft);font-size:.88rem;margin-top:12px}
.toggle{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:.92rem}
.toggle input{width:20px;height:20px;accent-color:var(--brass)}

/* review */
.split{margin:14px 0 4px;display:grid;grid-template-columns:52px 1fr;gap:6px 10px;align-items:center;font-size:.85rem}
.stack{display:flex;height:18px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.stack span{display:block;height:100%}
.nudges{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.nudge{padding:11px 12px 11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));font-size:.93rem}
.nudge.peak{background:var(--brass-soft);border-left-color:var(--brass)}
.rows{display:flex;flex-direction:column;gap:14px;margin-top:4px}
.r-head{display:flex;align-items:baseline;gap:8px}
.r-head .nm{font-weight:700;flex:1}
.r-head .fig{font-size:.9rem;color:var(--muted)}
.var{font-weight:700;font-size:.85rem;padding:2px 8px;border-radius:999px;background:var(--sunk)}
.var.bad{color:var(--bad)} .var.good{color:var(--good)}
.track{position:relative;height:10px;border-radius:5px;background:var(--sunk);margin-top:6px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--c)}
.rowtotal{padding-top:10px;border-top:1px dashed var(--line)}
.mark{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink)}
.empty{padding:28px 18px;text-align:center;border-radius:16px;border:1.5px dashed var(--line);margin-top:14px}

/* plan & settings */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px}
.check{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.check:last-child{border-bottom:0}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:700}
.check.done .box{background:var(--good);border-color:var(--good);color:#fff}
.check.done .lb{text-decoration:line-through;text-decoration-color:var(--muted)}
.lb{font-weight:600} .lb small{display:block;font-weight:400;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:.88rem;color:var(--muted)}
.field input{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.peak{padding:12px 0;border-bottom:1px solid var(--line)}
.peak:last-child{border-bottom:0}
.tgt{display:grid;grid-template-columns:1fr auto auto;gap:6px 8px;align-items:center}
.tgt .hd{font-size:.78rem;color:var(--muted);text-align:center}
.tgt .stepper button{width:30px;height:30px}
.tgt .stepper .val{min-width:36px}
.tgt .sum{font-weight:700;text-align:center}
.tgt .sum.off{color:var(--brass)}
details{margin-top:4px}
summary{cursor:pointer;font-weight:600;padding:10px 0}
ol.steps{margin:0 0 10px;padding-left:22px}
ol.steps li{margin:5px 0}
.pickcats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:520px;margin:0 auto;display:flex}
.tabs button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs svg{width:24px;height:24px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:.9rem;max-width:90vw;z-index:10;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.status{font-size:.8rem;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<main class="app" id="view"></main>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" role="status"></div>

<script src="xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
/* ---------- constants ---------- */
const CATS=[
 {id:'family',en:'Family',zh:'家庭',rank:1},
 {id:'health',en:'Health',zh:'健康',rank:2},
 {id:'social',en:'Social',zh:'社交',rank:3},
 {id:'sleep',en:'Sleep',zh:'睡眠',rank:4},
 {id:'meal',en:'Meal and rest',zh:'用膳休息',rank:4.5},
 {id:'cpa',en:'CPA firm',zh:'會計師行',rank:5,work:true},
 {id:'clinic',en:'Clinic Solution',zh:'診所',rank:5,work:true},
 {id:'ai',en:'AI transformation',zh:'AI 轉型',rank:5,work:true},
 {id:'hobbies',en:'Hobbies',zh:'興趣',rank:6},
 {id:'chores',en:'Chores',zh:'雜務',rank:7},
 {id:'waste',en:'Time wasted',zh:'浪費時間',rank:8}];
const WORK=['cpa','clinic','ai'];
const LESS=['cpa','clinic','chores','waste'];
const workSum=o=>WORK.reduce((s,c)=>s+(o[c]||0),0);
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const LOG_ORDER=['cpa','meal','ai','family','clinic','chores','health','waste','hobbies','social'];
const VIEW_ORDER=['sleep',...LOG_ORDER];
const HINT={cpa:'Audit, tax, clients, incl. entertaining',clinic:'Clinic Solution work',ai:'AI projects and hands-on learning',
 family:'Spouse, daughter, parents',chores:'Commute, housework, queues, admin',health:'Tennis, swimming, medical',meal:'Meals, breaks, real rest',
 social:'Friends, not networking',hobbies:'Real enjoyment, travel, entertainment',waste:'Scrolling, nonstop YouTube'};
const FIXED=[{id:'date',label:'Date with my wife',sub:'No kids'},{id:'friends',label:'Gathering with friends'},
 {id:'ai',label:'Half-day hands-on AI project'},{id:'review',label:'Month-end review',sub:'Actual vs. targets'}];
const UNDER={
 family:'Family is {x} under plan. Protect breakfast, the school run and bedtime with your daughter.',
 health:'Health is {x} under plan. Book tennis or a swim. Swimming with your daughter counts for family too.',
 social:'Social is {x} under plan. Message a friend and set a date.',
 sleep:'Sleep is {x} under plan. Try going to bed 30 minutes earlier.',
 hobbies:'Hobbies are {x} under plan. Block an hour for something purely fun.',
 ai:'AI transformation is {x} under plan. Use the hour before work on a real firm workflow.',
 chores:'Chores came in {x} under plan. Put the saved time into sleep and health first.'};
const OVER={
 work:'Work, all three roles, is {x} over plan. That time is coming from somewhere. Check family and sleep.',
 waste:'{x} of time wasted. That is sleep, family or a real rest you did not get. Put the phone in another room.',
 chores:'Chores ran {x} over plan. Outsource, automate or cut the commute.'};
const LS_KEY='timeledger.v1';

/* ---------- date helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const todayKey=()=>keyOf(new Date());
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate=k=>{const d=fromKey(k);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const fmtShort=k=>{const d=fromKey(k);return d.getDate()+' '+MON[d.getMonth()]};
const fmtH=h=>{const r=Math.round(h*10)/10;return (Number.isInteger(r)?r:r.toFixed(1))+'h'};
const fmtClock=h=>{const hh=Math.floor(h)%24,mm=Math.round((h-Math.floor(h))*60);return (hh%12||12)+':'+pad(mm)+' '+(hh<12?'am':'pm')};
const daysBetween=(a,b)=>Math.round((fromKey(b)-fromKey(a))/864e5);
const mondayOf=k=>{const d=fromKey(k);const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return keyOf(d)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- state ---------- */
function defaultState(){return{v:2,updatedAt:0,
 settings:{wake:7.5,bed:24.5,workCap:50,targets:{
  wd:{sleep:7,meal:0,cpa:7.5,clinic:2,ai:1,family:2.5,health:1,social:0,hobbies:0.5,chores:2.5,waste:0},
  we:{sleep:7.5,meal:0,cpa:0.5,clinic:0.5,ai:1,family:8,health:1,social:1.5,hobbies:1.5,chores:2.5,waste:0}}},
 combos:[{id:'swim',name:'Swim with daughter',cats:['family','health']},
  {id:'outing',name:'Family outing or trip',cats:['family','hobbies']},
  {id:'sportfriends',name:'Tennis with friends',cats:['social','health']}],
 peaks:[],fixed:{},days:{}}}
function migrate(s){if((s.v||1)>=2)return s;
 const map={work:'cpa',learning:'ai','c:aiwork':'ai'};
 Object.values(s.days||{}).forEach(x=>['m','e'].forEach(k=>{if(Array.isArray(x[k]))x[k]=x[k].map(i=>map[i]||i)}));
 s.combos=(s.combos||[]).filter(c=>c.id!=='aiwork').map(c=>({...c,cats:c.cats.map(x=>map[x]||x)})).filter(c=>c.cats[0]!==c.cats[1]);
 if(s.settings)delete s.settings.targets;s.v=2;return s}
function normalize(s){const d=defaultState();if(!s||typeof s!=='object')return d;s=migrate(s);
 s.settings=Object.assign({},d.settings,s.settings||{});
 s.settings.targets=s.settings.targets||d.settings.targets;
 ['wd','we'].forEach(t=>{s.settings.targets[t]=Object.assign({},d.settings.targets[t],s.settings.targets[t]||{})});
 s.combos=Array.isArray(s.combos)?s.combos:d.combos;s.peaks=Array.isArray(s.peaks)?s.peaks:[];
 s.fixed=s.fixed||{};s.days=s.days||{};
 Object.values(s.days).forEach(x=>{x.m=Array.isArray(x.m)?x.m:[];x.e=Array.isArray(x.e)?x.e:[]});
 return s}
function loadLocal(){try{const r=localStorage.getItem(LS_KEY);return r?normalize(JSON.parse(r)):null}catch(e){return null}}
let state=loadLocal()||defaultState();
function localSave(){try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
function save(){state.updatedAt=Date.now();localSave();queueRemote()}

/* ---------- account sync (private per-user db doc) ---------- */
const remote={ref:null,status:'local',writing:false,pending:false,timer:null};
async function initRemote(){
 try{
  if(!window.claude||typeof window.claude.use!=='function')return;
  const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
  if(!db||!user)return;
  const uid=await user.id();if(!uid)return;
  const ref=db.doc('data/users/'+uid+'/tracker');
  const snap=await ref.get();
  remote.ref=ref;remote.status='synced';
  if(snap.exists){
   const data=snap.data();
   if((data.updatedAt||0)>(state.updatedAt||0)){state=normalize(JSON.parse(JSON.stringify(data)));localSave()}
   else if((state.updatedAt||0)>(data.updatedAt||0))queueRemote();
  }else if(state.updatedAt)queueRemote();
  render();
 }catch(e){remote.status='local'}
}
function queueRemote(){if(!remote.ref)return;clearTimeout(remote.timer);remote.timer=setTimeout(flush,900)}
async function flush(){
 if(!remote.ref)return;
 if(remote.writing){remote.pending=true;return}
 remote.writing=true;
 try{await remote.ref.set(JSON.parse(JSON.stringify(state)));remote.status='synced'}
 catch(e){if(e&&e.code==='unavailable'){setTimeout(queueRemote,1200+Math.random()*1500)}else remote.status='error'}
 remote.writing=false;
 if(remote.pending){remote.pending=false;flush()}
 const st=document.getElementById('syncstatus');if(st)st.textContent=statusText();
}
function statusText(){return remote.status==='synced'?'Saved privately to your Claude account, and on this phone.':
 remote.status==='error'?'Could not save to your account. Data is kept on this phone; export a backup.':
 'Saved on this phone only. Back up once a month, and before changing phones.'}

/* ---------- day model ---------- */
const S=()=>state.settings;
function day(k,create){let d=state.days[k];if(!d&&create){d=state.days[k]={m:[],e:[]}}return d}
const wakeOf=k=>{const d=day(k);return d&&d.wake!=null?d.wake:S().wake};
const bedOf=k=>{const d=day(k);return d&&d.bed!=null?d.bed:S().bed};
const bankTotal=(k,s)=>s==='m'?Math.max(0,13-wakeOf(k)):Math.max(0,bedOf(k)-13);
const isLogged=k=>{const d=day(k);return !!(d&&(d.m.length||d.e.length))};
const isWeekend=k=>{const w=fromKey(k).getDay();const d=day(k);return w===0||w===6||!!(d&&d.holiday)};
const targetsFor=k=>S().targets[isWeekend(k)?'we':'wd'];
function sleepOf(k){const d=day(k);if(d&&d.sleep!=null)return d.sleep;const p=day(addDays(k,-1));
 const bed=p&&p.bed!=null?p.bed:S().bed;return Math.max(0,Math.min(14,24+wakeOf(k)-bed))}
const comboById=id=>state.combos.find(c=>c.id===id);

 ['m','e'].forEach(s=>d[s].forEach(it=>catsOf(it).forEach(c=>{o[c]+=0.5})));o.sleep+=sleepOf(k);return o}
function streak(){let k=todayKey();const full=x=>{const d=day(x);return d&&d.m.length&&d.e.length&&!d.late};
 if(!full(k))k=addDays(k,-1);let n=0;while(full(k)){n++;k=addDays(k,-1)}return n}

/* ---------- aggregation ---------- */
function periodDays(p,anchor){const t=todayKey();let ks=[];
 if(p==='day')ks=[anchor];
 else if(p==='week'){const m=mondayOf(anchor);for(let i=0;i<7;i++)ks.push(addDays(m,i))}
 else{const d=fromKey(anchor);const y=d.getFullYear(),mo=d.getMonth();const n=new Date(y,mo+1,0).getDate();
  for(let i=1;i<=n;i++)ks.push(keyOf(new Date(y,mo,i)))}
 return ks.filter(k=>k<=t)}
function aggregate(ks){const a=Object.fromEntries(CATS.map(c=>[c.id,0])),t={...a};const logged=[];
 ks.forEach(k=>{const x=actualsOf(k);if(!x)return;logged.push(k);const tg=targetsFor(k);
  CATS.forEach(c=>{a[c.id]+=x[c.id];t[c.id]+=tg[c.id]||0})});
 return{actual:a,target:t,logged,elapsed:ks.length}}
function peakDebt(p){let s=0,f=0;const end=p.end<todayKey()?p.end:todayKey();
 for(let k=p.start;k<=end;k=addDays(k,1)){const x=actualsOf(k);if(!x)continue;const t=targetsFor(k);
  s+=Math.max(0,t.sleep-x.sleep);f+=Math.max(0,t.family-x.family)}return{sleep:s,family:f}}
function nudges(ks,agg,period){
 const out=[];const n=agg.logged.length;if(!n)return out;const today=todayKey();
 const peak=state.peaks.find(p=>ks.some(k=>k>=p.start&&k<=p.end));
 if(peak){const d=peakDebt(peak);const left=daysBetween(today,peak.end);
  out.push({cls:'peak',text:'Peak season "'+esc(peak.name)+'" '+(left>=0?'ends '+fmtShort(peak.end)+' ('+left+' day'+(left===1?'':'s')+' left)':'ended '+fmtShort(peak.end))+
   '. Owed so far: '+fmtH(d.sleep)+' sleep, '+fmtH(d.family)+' family.'})}
 state.peaks.forEach(p=>{if(p===peak)return;const since=daysBetween(p.end,today);if(since<1||since>28)return;
  const d=peakDebt(p);if(d.sleep+d.family<1)return;
  out.push({cls:'peak',text:'Recovery from "'+esc(p.name)+'": make up '+fmtH(d.sleep)+' sleep and '+fmtH(d.family)+' family.'})});
 const cap=S().workCap;
 if(!peak){const weekly=period==='week'?workSum(agg.actual):workSum(agg.actual)/n*7;
  if(period!=='day'&&weekly>cap)out.push({c:'cpa',text:(period==='week'?'Work reached '+fmtH(weekly):'Work is averaging '+fmtH(weekly)+' a week')+
   ', over your '+cap+'h cap. Cut back, or set a peak season with an end date.'})}
 CATS.forEach(c=>{const a=agg.actual[c.id],t=agg.target[c.id],v=a-t;const tol=Math.max(n>1?1:0.5,t*0.15);
  if(v<-tol&&UNDER[c.id])out.push({c:c.id,text:UNDER[c.id].replace('{x}',fmtH(-v))});
  else if(c.id==='waste'&&a>=0.5)out.push({c:'waste',text:OVER.waste.replace('{x}',fmtH(a))});
  else if(v>tol&&OVER[c.id])out.push({c:c.id,text:OVER[c.id].replace('{x}',fmtH(v))})});
 {const a=workSum(agg.actual),t=workSum(agg.target),tol=Math.max(n>1?1:0.5,t*0.15);
  if(a-t>tol&&!peak)out.push({c:'cpa',text:OVER.work.replace('{x}',fmtH(a-t))})}
 if(period==='month'&&ks[0].slice(0,7)===today.slice(0,7)){const f=state.fixed[today.slice(0,7)]||{};
  const miss=FIXED.filter(x=>!f[x.id]).map(x=>x.label.toLowerCase());
  if(miss.length)out.push({cls:'peak',text:'Still to do this month: '+miss.join(', ')+'.'})}
 if(n<agg.elapsed)out.push({text:'Logged '+n+' of '+agg.elapsed+' days. Targets only count logged days.'});
 return out}

 h+='<h2>Your data</h2><div class="card" style="padding:12px 14px"><div class="small" id="syncstatus">'+statusText()+'</div>'+
  '<div class="actions" style="flex-wrap:wrap"><button class="btn primary" data-act="export">Export to Excel</button><button class="btn" data-act="backup">Back up</button><button class="btn" data-act="restore">Restore</button></div>'+
  '<input type="file" id="restore-file" accept="application/json,.json" hidden>'+
  '<p class="small muted">Back up saves one file with everything. Restore loads it on a new phone.</p>'+
  '<div class="actions"><button class="btn warn" data-act="reset">Erase all</button></div></div>';
 return h}

/* ---------- actions ---------- */
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}
function touchDay(k){const d=day(k,true);if(k<todayKey())d.late=true;return d}
function addItem(id,fill){const k=ui.date,s=ui.session,d=touchDay(k),cap=Math.round(bankTotal(k,s)*2);
 if(d[s].length>=cap){const b=document.getElementById('bank');if(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}
  toast('All hours logged. Remove a block or change the '+(s==='m'?'wake-up':'bed')+' time.');return}
 if(fill){while(d[s].length<cap)d[s].push(id)}else d[s].push(id);save();render()}
function trim(k){const d=day(k);if(!d)return;let cut=false;['m','e'].forEach(s=>{const cap=Math.round(bankTotal(k,s)*2);if(d[s].length>cap){d[s].length=cap;cut=true}});
 if(cut)toast('Trimmed the last blocks to fit the new time.')}
const handlers={
 tab:v=>{ui.tab=v;render();scrollTo(0,0)},
 day:v=>{const n=addDays(ui.date,+v);if(n<=todayKey()){ui.date=n;render()}},
 session:v=>{ui.session=v;render()},
 add:v=>addItem(v,false),
 minus:v=>{const d=day(ui.date);if(!d)return;const a=d[ui.session];const i=a.lastIndexOf(v);if(i>-1){a.splice(i,1);touchDay(ui.date);save();render()}},
 undo:()=>{const d=day(ui.date);if(d&&d[ui.session].length){d[ui.session].pop();save();render()}},
 clear:()=>{if(!confirm('Clear everything logged in this session?'))return;const d=day(ui.date);if(d){d[ui.session]=[];save();render()}},
 wake:v=>{const d=touchDay(ui.date);d.wake=+v;trim(ui.date);save();render()},
 bed:v=>{const d=touchDay(ui.date);d.bed=+v;trim(ui.date);save();render()},
 sleep:v=>{const d=touchDay(ui.date);d.sleep=Math.max(0,Math.min(14,sleepOf(ui.date)+(+v)));save();render()},
 period:v=>{ui.period=v;render()},
 shift:v=>{const n=+v;ui.anchor=ui.period==='day'?addDays(ui.anchor,n):ui.period==='week'?addDays(ui.anchor,7*n):(()=>{const d=fromKey(ui.anchor);return keyOf(new Date(d.getFullYear(),d.getMonth()+n,1))})();
  if(ui.anchor>todayKey())ui.anchor=todayKey();render()},
 golog:()=>{ui.tab='log';ui.date=todayKey();render()},
 pmonth:v=>{const [y,m]=ui.planMonth.split('-').map(Number);const d=new Date(y,m-1+(+v),1);ui.planMonth=d.getFullYear()+'-'+pad(d.getMonth()+1);render()},
 fixed:v=>{const f=state.fixed[ui.planMonth]=state.fixed[ui.planMonth]||{};if(f[v])delete f[v];else f[v]=todayKey();save();render()},
 monthreview:()=>{ui.tab='review';ui.period='month';ui.anchor=ui.planMonth+'-01';render()},
 addpeak:()=>{const n=document.getElementById('pk-name').value.trim(),s=document.getElementById('pk-start').value,e=document.getElementById('pk-end').value;
  if(!n){toast('Give the peak season a name.');return}if(!s||!e){toast('A peak season needs both a start and an end date.');return}
  if(e<s){toast('The end date is before the start date.');return}
  state.peaks.push({id:'p'+Date.now(),name:n,start:s,end:e});save();render();toast('Peak season added.')},
 delpeak:v=>{if(!confirm('Delete this peak season?'))return;state.peaks=state.peaks.filter(p=>p.id!==v);save();render()},
 tgt:(v,ds)=>{const T=S().targets[ds.t];T[ds.c]=Math.max(0,Math.min(24,(T[ds.c]||0)+(+v)));save();render()},
 cap:v=>{S().workCap=Math.max(20,Math.min(100,S().workCap+(+v)));save();render()},
 dwake:v=>{S().wake=Math.max(4,Math.min(12,S().wake+(+v)));save();render()},
 dbed:v=>{S().bed=Math.max(20,Math.min(28,S().bed+(+v)));save();render()},
 pickcat:v=>{const p=ui.comboPick;const i=p.indexOf(v);if(i>-1)p.splice(i,1);else{p.push(v);if(p.length>2)p.shift()}render()},
 addcombo:()=>{const n=document.getElementById('cb-name').value.trim();if(!n){toast('Name the activity.');return}
  if(ui.comboPick.length!==2){toast('Pick exactly two categories.');return}
  state.combos.push({id:'x'+Date.now(),name:n,cats:[...ui.comboPick]});ui.comboPick=[];save();render();toast('Activity added.')},
 delcombo:v=>{const c=comboById(v);if(c){c.hidden=true;save();render()}},
 export:()=>exportXlsx(),
 backup:()=>backup(),
 restore:()=>document.getElementById('restore-file').click(),
 reset:()=>{if(!confirm('Erase all logged time, targets and settings? Export first if you want a copy.'))return;state=defaultState();save();render();toast('Erased.')}
};
let longFired=false,pressTimer=null;
document.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-act="add"]');if(!t||e.target.closest('[data-act="minus"]'))return;
 longFired=false;clearTimeout(pressTimer);pressTimer=setTimeout(()=>{longFired=true;addItem(t.dataset.v,true);if(navigator.vibrate)navigator.vibrate(15)},550)});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(pressTimer)));
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-act="add"]'))e.preventDefault()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
 if(b.dataset.act==='add'&&longFired){longFired=false;return}
 e.stopPropagation();const f=handlers[b.dataset.act];if(f)f(b.dataset.v,b.dataset)});
document.addEventListener('change',e=>{if(e.target.id==='restore-file'&&e.target.files[0]){restore(e.target.files[0]);e.target.value='';return}
 if(e.target.dataset.act==='holiday'){const d=touchDay(ui.date);d.holiday=e.target.checked;save();render()}});

/* ---------- files ---------- */
function saveFile(name,blob){
 const f=new File([blob],name,{type:blob.type});
 if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Saved '+name)}
function backup(){saveFile('time-ledger-backup-'+todayKey()+'.json',new Blob([JSON.stringify(state)],{type:'application/json'}))}
function restore(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.days)throw 0;
 if(!confirm('Replace everything on this phone with the backup from this file?'))return;
 state=normalize(d);save();render();toast('Backup restored.')}catch(e){toast('That file is not a Time Ledger backup.')}};r.readAsText(file)}
/* ---------- export ---------- */
async function exportXlsx(){
 if(typeof XLSX==='undefined'){toast('The Excel tool did not load. Check your connection and try again.');return}
 const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
 const keys=Object.keys(state.days).filter(isLogged).sort();
 if(!keys.length){toast('Nothing logged yet to export.');return}
 const daily=keys.map(k=>{const a=actualsOf(k),t=targetsFor(k),r={Date:k,Day:DOW[fromKey(k).getDay()],Targets:isWeekend(k)?'Weekend':'Weekday',Backfilled:day(k).late?'Yes':'No'};
  CATS.forEach(c=>{r[c.en]=a[c.id]});CATS.forEach(c=>{r[c.en+' target']=t[c.id]});return r});
 const entries=[];keys.forEach(k=>{const d=day(k);[['m','Morning'],['e','Evening']].forEach(([s,l])=>{const cnt={};d[s].forEach(i=>{cnt[i]=(cnt[i]||0)+1});
  Object.entries(cnt).forEach(([i,n])=>{const cb=i.startsWith('c:')?comboById(i.slice(2)):null;
   entries.push({Date:k,Session:l,Activity:cb?cb.name:CAT[i].en,Hours:n*0.5,'Counts toward':catsOf(i).map(x=>CAT[x].en).join(' + ')})})});
  entries.push({Date:k,Session:'Night',Activity:'Sleep',Hours:sleepOf(k),'Counts toward':'Sleep'})});
 const summ=(groupKey,label)=>{const g={};keys.forEach(k=>{const gk=groupKey(k);(g[gk]=g[gk]||[]).push(k)});const rows=[];
  Object.keys(g).sort().forEach(gk=>{const a=aggregate(g[gk]);CATS.forEach(c=>rows.push({[label]:gk,Category:c.en,'Actual (h)':a.actual[c.id],'Target (h)':a.target[c.id],
   'Variance (h)':Math.round((a.actual[c.id]-a.target[c.id])*10)/10,'Days logged':a.logged.length}))});return rows};
 const targets=CATS.map(c=>({Category:c.en,'Chinese':c.zh,Priority:c.rank,'Weekday (h/day)':S().targets.wd[c.id],'Weekend (h/day)':S().targets.we[c.id],'Weekly (h)':S().targets.wd[c.id]*5+S().targets.we[c.id]*2}));
 const wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summ(mondayOf,'Week starting')),'Weekly');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summ(k=>k.slice(0,7),'Month')),'Monthly');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(daily),'Daily');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(entries),'Entries');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(targets),'Targets');
 const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
 if(!dl){saveFile('time-ledger-'+todayKey()+'.xlsx',new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));return}
 try{await dl.save({filename:'time-ledger-'+todayKey()+'.xlsx',data:new Blob([buf])});toast('Exported.')}
 catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rate_limited'?'A save is already open. Try again in a moment.':'Export could not be saved here.')}
}

render();
initRemote();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
